<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آموزش: آرایه منبع جدول است</title>
    <style>
        body { font-family: Tahoma; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📝 مدیریت داده با آرایه (منبع اصلی)</h2>
    
    <div>
        <input type="text" id="nameInput" placeholder="نام">
        <input type="text" id="familyInput" placeholder="نام خانوادگی">
        <input type="number" id="numInput" placeholder="عدد">
        <button id="addBtn">➕ افزودن به آرایه</button>
        <button id="showArrayBtn">🔍 نمایش آرایه در کنسول</button>
    </div>

    <table id="myTable">
        <thead>
            <tr><th>نام</th><th>نام خانوادگی</th><th>عدد</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // ======================================
        // فقط یک آرایه - منبع اصلی و唯一 داده‌ها
        // ======================================
        let myArray = [];  // اینجا همه چیز ذخیره می‌شود

        // تابع برای ساخت جدول از روی آرایه
        function buildTableFromArray() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';  // پاک کردن جدول
            
            // حلقه روی آرایه و ساختن هر سطر
            for (let i = 0; i < myArray.length; i++) {
                const person = myArray[i];
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${person.name}</td>
                    <td>${person.family}</td>
                    <td>${person.number}</td>
                `;
                tbody.appendChild(row);
            }
            
            // اگر آرایه خالی بود پیغام نشان بده
            if (myArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">📭 آرایه خالی است - داده‌ای وجود ندارد</td></tr>';
            }
            
            console.log('✅ جدول از روی آرایه ساخته شد. آرایه الان:', myArray);
        }

        // تابع افزودن به آرایه و سپس بازسازی جدول
        function addToArray() {
            const name = document.getElementById('nameInput').value.trim();
            const family = document.getElementById('familyInput').value.trim();
            const number = document.getElementById('numInput').value.trim();
            
            if (!name || !family || !number) {
                alert('همه فیلدها را پر کنید!');
                return;
            }
            
            // اضافه کردن به آرایه
            myArray.push({
                name: name,
                family: family,
                number: number
            });
            
            // پاک کردن فیلدها
            document.getElementById('nameInput').value = '';
            document.getElementById('familyInput').value = '';
            document.getElementById('numInput').value = '';
            
            // بازسازی جدول از روی آرایه جدید
            buildTableFromArray();
            
            console.log('✅ به آرایه اضافه شد. آرایه الان:', myArray);
        }
        
        // دکمه نمایش آرایه در کنسول
        function showArray() {
            console.clear();
            console.log('=== محتویات آرایه ===');
            console.log(myArray);
            console.log('تعداد آیتم‌ها:', myArray.length);
            alert(`آرایه در کنسول (F12) نمایش داده شد. ${myArray.length} آیتم وجود دارد.`);
        }
        
        // اتصال دکمه‌ها
        document.getElementById('addBtn').onclick = addToArray;
        document.getElementById('showArrayBtn').onclick = showArray;
        
        // شروع با آرایه خالی و جدول خالی
        buildTableFromArray();
        
        // توضیح در کنسول
        console.log('🚀 برنامه آماده است. هر بار که افزودن می‌زنید:');
        console.log('   1️⃣ اطلاعات به myArray اضافه می‌شود');
        console.log('   2️⃣ تابع buildTableFromArray() اجرا می‌شود');
        console.log('   3️⃣ تابع از روی myArray جدول را می‌سازد');
    </script>
</body>
</html>
