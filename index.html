<html lang="en">
<head>
    <title>Usdt Users</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <header>
        <h1>User$</h1>
        <div class="search">
            <span>search :</span>
            <input type="search" placeholder="type something...">
        </div>
    </header>

    <div class="section2">
        <div class="information-Container">
            <div class="input-container">
                <label for="fName">First Name : </label>
                <input type="text" placeholder="Enter your first name"  id="fName" required autocomplete="off"> <br>

                <label for="lName">Last Name : </label>
                <input type="text" placeholder="Enter your last name" id="lName" required autocomplete="off"> <br>

                <label for="assets">Assets $ :</label>
                <input type="number" placeholder="Enter the amount" id="assets" required autocomplete="off">
            </div>
            <div class="btn-container">
                <button type="submit" id="add">Add</button>
                <button type="submit" id="minus">Minus</button>
            </div>
        </div>

        <!-- <div class="image-container">
            <img src="./Images/rocket-12252.svg">
        </div> -->
    </div>



    <div class="data-container">

        <table class="table">
            <thead>            
                <tr>
                    <th>Num</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Assets $</th>
                    <th>Transactions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row">
                    <td colspan="5">There is no data 📭 </td>
                </tr>
            </tbody>
        </table>

        <div class="under-table-container">
            <div class="counter" id="rowCounter">Record Count: 0</div>
            <button id="clearAllBtn" class="clear-btn">Delete All users 🗑</button>
        </div>
    </div>


    <script src="./script.js"></script>

</body>
</html>
