<html lang="en">
<head>
    <title>User Management System - Deposits and Withdrawals 💰</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>Login to the system🔐</h2>
            <input type="password" id="passwordInput" placeholder="Enter password" autofocus autocomplete="off">
            <button id="loginBtn">Login</button>
        </div>
    </div>

    <div id="mainApp" class="main-app">
        <header>
            <h1>User$</h1>
            <div class="header-content">
                <!-- <button class="search">🔎<button> -->
                <div class="security-container">
                    <button id="searchModalBtn" class="search-btn">🔍</button>
                    <button id="changePasswordBtn" class="change-password-btn security-btn">Change Password 🔑</button>
                    <button id="lockScreenBtn" class="lock-btn security-btn">Lock Screen 🔒</button>
                </div>
            </div>
        </header><!-- <input type="search" placeholder="type something..."> -->

        <div class="section2">
            <div class="information-Container">
                <div class="input-container">
                    <label for="fName">First Name : </label>
                    <input type="text" placeholder="Enter your first name"  id="fName" required autocomplete="off"> <br>

                    <label for="lName">Last Name : </label>
                    <input type="text" placeholder="Enter your last name" id="lName" required autocomplete="off"> <br>

                    <label for="amount">Amount $ :</label>
                    <input type="number" placeholder="Enter the amount" id="amount" required autocomplete="off">
                </div>
                <div class="btn-container">
                    <button type="submit" id="deposit">Deposit</button>
                    <button type="submit" id="withdraw">Withdraw</button>
                </div>
            </div>

            <!-- <div class="image-container">
                <img src="./Images/rocket-12252.svg">
            </div> -->
        </div>


        <div class="data-container">
            <table class="table">
                <thead>            
                    <tr>
                        <th>Num</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Total Assets</th>
                        <th>📊</th>
                        <th>Transactions</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row">
                        <td colspan="5">There is no data 📭 </td>
                    </tr>
                </tbody>
            </table>

            <div class="under-table-container">
                <div class="counter" id="rowCounter">Record Count: 0</div>
                <button id="saveBackupBtn" class="save-backup useful-buttons">Save Backup 💾</button>
                <button id="restoreBackupBtn" class="restore-backup useful-buttons">Restore Backup 📂</button>
                <button id="clearAllBtn" class="clear-btn useful-buttons">Delete All users 🗑</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="searchModal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h3>Search Users</h3>
                <span class="close-search-modal">&times;</span>
            </div>
            <div class="search-modal-body">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInputModal" placeholder="Search by first or last name..." autocomplete="off">
                </div>
                <div id="searchResults" class="search-results">

                </div>
            </div>
        </div>
    </div>




    <div id="chartModal" class="chart-modal">
        <div class="chart-modal-content">
            <div class="chart-modal-header">
                <h3 id="chartModalTitle">📊 Financial Trend Chart</h3>
                <span class="close-chart-modal">&times;</span>
            </div>
            <div class="chart-modal-body">
                <div class="chart-container">
                    <canvas id="balanceChart"></canvas>
                </div>
            </div>
        </div>
    </div>




    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: rgb(255, 255, 255);">📋 Transaction history</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div id="transactionsList"></div>
            <button id="clearUserTransactionsBtn" class="clear-transactions-btn">🗑 Delete all transactions for this user</button>
        </div>
    </div>


    <script src="./script.js"></script>

</body>
</html>
